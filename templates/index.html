<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PaperLens: find research papers on any topic, get plain-language summaries, and ask an assistant to explain them.">
    <title>PaperLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>

    <header class="header" id="header">
        <div class="header__logo">
            <span class="header__icon">🔬</span>
            <span class="header__title">PaperLens</span>
        </div>
        <nav class="header__nav" aria-label="Main">
            <a href="#/discover" class="header__link" data-route="discover">Discover</a>
            <a href="#/library" class="header__link" data-route="library">Library</a>
            <a href="#/assistant" class="header__link" data-route="assistant">Assistant</a>
        </nav>
    </header>

    <main id="main">
        <section class="view" id="view-discover" data-view="discover">
            <div class="hero" id="hero-section">
                <h1 class="hero__title">Understand research papers<br><span class="hero__gradient">in plain language</span></h1>
                <p class="hero__subtitle">Enter a topic to find papers, get a clear summary of any of them, and ask the assistant to explain anything you do not understand.</p>
            </div>
        </section>
        <section class="view" id="view-library" data-view="library" hidden></section>
        <section class="view" id="view-assistant" data-view="assistant" hidden></section>
    </main>

    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Details" hidden></aside>

    <footer class="footer" id="footer">
        <p>PaperLens: read research with confidence.</p>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/core.js"></script>
    <script src="/static/js/view_discover.js"></script>
    <script src="/static/js/view_library.js"></script>
    <script src="/static/js/view_assistant.js"></script>
    <script>PL.start();</script>
</body>

</html>
